{% extends "base.html" %}
{% block title %}상품 수정{% endblock %}
{% block content %}
<h2>상품 수정</h2>
{# 이 페이지는 @owner_required_product가 지킨다. 로그인만으로는 부족하고,
   요청자가 이 상품의 판매자(또는 관리자)여야 한다. 이 검사가 없으면
   URL의 product_id만 바꿔 남의 상품을 수정할 수 있다(IDOR). #}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="title">상품명</label>
  <input type="text" id="title" name="title" required maxlength="100"
         value="{{ product['title'] }}">

  <label for="description">상품 설명</label>
  <textarea id="description" name="description" rows="5" required
            maxlength="2000">{{ product['description'] }}</textarea>

  <label for="price">가격 (원)</label>
  <input type="number" id="price" name="price" required min="1" max="100000000"
         value="{{ product['price'] }}">

  <button type="submit">수정하기</button>
</form>
<p><a href="{{ url_for('view_product', product_id=product['id']) }}">취소</a></p>
{% endblock %}
