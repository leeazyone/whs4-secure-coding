{% extends "base.html" %}
{% block title %}상품 관리{% endblock %}
{% block content %}
<h2>상품 관리</h2>
<p class="muted"><a href="{{ url_for('admin_dashboard') }}">← 관리자 대시보드</a></p>

<table>
  <tr>
    <th>상품명</th><th>판매자</th><th class="right">가격</th>
    <th>상태</th><th>신고</th><th>조치</th>
  </tr>
  {% for p in products %}
    <tr>
      <td><a href="{{ url_for('view_product', product_id=p['id']) }}">{{ p['title'] }}</a></td>
      <td><a href="{{ url_for('view_user', user_id=p['seller_id']) }}">{{ p['seller_name'] }}</a></td>
      <td class="right">{{ '{:,}'.format(p['price']) }}원</td>
      <td><span class="status status-{{ p['status'] }}">{{ p['status'] }}</span></td>
      <td>{{ p['report_count'] }}</td>
      <td>
        <form method="post" class="inline-form"
              action="{{ url_for('admin_set_product_status', product_id=p['id']) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <select name="status">
            <option value="active"  {% if p['status'] == 'active'  %}selected{% endif %}>active</option>
            <option value="blocked" {% if p['status'] == 'blocked' %}selected{% endif %}>blocked</option>
            <option value="sold"    {% if p['status'] == 'sold'    %}selected{% endif %}>sold</option>
          </select>
          <button type="submit" class="inline">변경</button>
        </form>
      </td>
    </tr>
  {% endfor %}
</table>
{% endblock %}
